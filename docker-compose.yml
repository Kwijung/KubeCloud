services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kloudia
      POSTGRES_PASSWORD: kloudia
      POSTGRES_DB: kloudia
    ports:
      - "5432:5432"
    volumes:
      - kloudia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kloudia -d kloudia"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kloudia-postgres:
