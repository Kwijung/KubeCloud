# External network for kube-ovn VPC NAT gateways: macvlan on the node uplink, IPs (EIPs) from kube-ovn IPAM.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: ovn-vpc-external-network
  namespace: kube-system
spec:
  config: '{"cniVersion":"0.3.0","type":"macvlan","master":"enp1s0","mode":"bridge","ipam":{"type":"kube-ovn","server_socket":"/run/openvswitch/kube-ovn-daemon.sock","provider":"ovn-vpc-external-network.kube-system"}}'
---
apiVersion: kubeovn.io/v1
kind: Subnet
metadata:
  name: ovn-vpc-external-network
spec:
  protocol: IPv4
  provider: ovn-vpc-external-network.kube-system
  cidrBlock: 10.0.1.0/24
  gateway: 10.0.1.1
  # Only 10.0.1.200-10.0.1.219 are handed out as EIPs; the rest belongs to CloudiA.
  excludeIps:
    - 10.0.1.1..10.0.1.199
    - 10.0.1.220..10.0.1.254
