# Kloudia API and web console for a dev cluster.
# Images are built locally (localhost/kloudia-*:dev) and imported into each node's containerd,
# so imagePullPolicy is Never. Apply after kloudia-namespaces.yaml and postgres.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kloudia-api
  namespace: kloudia-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kloudia-api
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines", "virtualmachineinstances"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["subresources.kubevirt.io"]
    resources: ["virtualmachineinstances/console", "virtualmachines/start", "virtualmachines/stop", "virtualmachines/restart"]
    verbs: ["get", "update", "put"]
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # VM disks are cloned from image cache DataVolumes; CDI checks that the cloner may read the source.
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes/source"]
    verbs: ["create"]
  - apiGroups: ["kubeovn.io"]
    resources: ["vpcs", "subnets", "vpc-nat-gateways", "iptables-eips", "iptables-snat-rules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["k8s.cni.cncf.io"]
    resources: ["network-attachment-definitions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces", "persistentvolumeclaims", "pods", "events", "nodes"]
    verbs: ["get", "list", "watch"]
  # An image cache's volume is deleted with the image, also when CDI has already removed its DataVolume.
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["delete"]
  # VM boot logs come from the virt-launcher pod's guest-console-log container.
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kloudia-api
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kloudia-api
subjects:
  - kind: ServiceAccount
    name: kloudia-api
    namespace: kloudia-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kloudia-api
  namespace: kloudia-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kloudia-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kloudia-api
    spec:
      serviceAccountName: kloudia-api
      containers:
        - name: api
          image: localhost/kloudia-api:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgres://kloudia:kloudia@kloudia-postgres:5432/kloudia?sslmode=disable
            - name: KLOUDIA_KUBEVIRT_ENABLED
              value: "true"
            - name: KLOUDIA_KUBEVIRT_NAMESPACE
              value: kloudia-vms
            - name: KLOUDIA_KUBEVIRT_STORAGE_CLASS
              value: kv
            # kv is NFS, which supports ReadWriteMany, so VMs can live-migrate.
            - name: KLOUDIA_KUBEVIRT_DISK_ACCESS_MODE
              value: ReadWriteMany
            - name: KLOUDIA_NETWORK_PROVISIONING_ENABLED
              value: "true"
            - name: KLOUDIA_OVN_EXTERNAL_NETWORK
              value: ovn-vpc-external-network
            # Cilium pods, services, kube-ovn default and join subnets, and the node network that NAT egress uses.
            - name: KLOUDIA_RESERVED_CIDRS
              value: 10.244.0.0/16,10.96.0.0/12,10.16.0.0/16,100.64.0.0/16,10.0.1.0/24
            # A VPC cannot reach the cluster DNS service; VPC VMs use the CloudiA network's resolver instead.
            - name: KLOUDIA_VM_DNS_SERVERS
              value: 10.0.0.2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kloudia-api
  namespace: kloudia-system
spec:
  selector:
    app.kubernetes.io/name: kloudia-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kloudia-web
  namespace: kloudia-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kloudia-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kloudia-web
    spec:
      containers:
        - name: web
          image: localhost/kloudia-web:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: kloudia-web
  namespace: kloudia-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: kloudia-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
